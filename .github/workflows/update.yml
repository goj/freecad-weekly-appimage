name: "Bump FreeCAD Weekly"

on:
  schedule:
    # Every Thursday at 04:00 UTC (upstream releases weekly builds on Wednesdays)
    - cron: "0 4 * * 4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run update script
        run: |
          chmod +x update.sh
          ./update.sh

      - name: Build to verify
        run: nix build .#default .#freecad-dev

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            NEW_TAG=$(grep -oE 'weekly-[0-9]{4}\.[0-9]{2}\.[0-9]{2}' flake.nix | head -n 1)
            git add flake.nix flake.lock
            git commit -m "Bump FreeCAD weekly to $NEW_TAG"
            git push
          else
            echo "No updates found."
          fi
